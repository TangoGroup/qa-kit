# ~/qa-kit/.github/workflows/qa-gate.yml
name: qa-kit deploy gate (reusable)
on:
  workflow_call:
    inputs:
      deployed_url: { required: true, type: string }
      expected_sha: { required: true, type: string }
    secrets:
      anthropic_api_key: { required: false }

jobs:
  deploy-gate:
    runs-on: ubuntu-latest
    permissions: { contents: read, statuses: write }
    steps:
      # Consumer + qa-kit are checked out as SIBLINGS under the workspace so the
      # consumer's OPTIONAL `link:../qa-kit` dep resolves on a CI runner (no sibling
      # dir otherwise → dead link → gate can't run). qa-kit is public now, so no token.
      - name: Checkout consumer
        uses: actions/checkout@v4
        with: { path: app, ref: "${{ inputs.expected_sha }}" }
      - name: Checkout qa-kit (sibling, for link:../qa-kit)
        uses: actions/checkout@v4
        with: { repository: TangoGroup/qa-kit, path: qa-kit }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      # pnpm links the optional qa-kit dep only if ../qa-kit already exists — so the
      # sibling checkout above MUST run before this install.
      - name: Install consumer deps
        working-directory: app
        run: pnpm install
      - name: Install Playwright (chromium)
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium
      - name: Run qa-kit deploy gate
        working-directory: app
        env: { ANTHROPIC_API_KEY: "${{ secrets.anthropic_api_key }}" }
        run: |
          DATE=$(date +%F); RUN="qa-deploy-$(date +%Y%m%d-%H%M%S)"
          CFG=$(pnpm exec tsx -e "import('./qa.config.ts').then(m=>process.stdout.write(JSON.stringify(m.default.default??m.default)))")
          pnpm exec tsx node_modules/qa-kit/bin/qa-deploy-gate.mjs "$CFG" "${{ inputs.deployed_url }}" "${{ inputs.expected_sha }}" qa-testing/findings "$RUN" "$DATE"
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: qa-deploy-gate-findings, path: app/qa-testing/findings/**/* }
