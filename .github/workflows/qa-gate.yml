# ~/qa-kit/.github/workflows/qa-gate.yml
name: qa-kit deploy gate (reusable)
on:
  workflow_call:
    inputs:
      deployed_url: { required: true, type: string }
      expected_sha: { required: true, type: string }
    secrets:
      anthropic_api_key: { required: false }

jobs:
  deploy-gate:
    runs-on: ubuntu-latest
    permissions: { contents: read, statuses: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.expected_sha }}" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - name: Install Playwright (chromium)
        run: pnpm exec playwright install --with-deps chromium
      - name: Run qa-kit deploy gate
        run: |
          DATE=$(date +%F); RUN="qa-deploy-$(date +%Y%m%d-%H%M%S)"
          CFG=$(pnpm exec tsx -e "import('./qa.config.ts').then(m=>process.stdout.write(JSON.stringify(m.default.default??m.default)))")
          node node_modules/qa-kit/bin/qa-deploy-gate.mjs "$CFG" "${{ inputs.deployed_url }}" "${{ inputs.expected_sha }}" qa-testing/findings "$RUN" "$DATE"
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: qa-deploy-gate-findings, path: qa-testing/findings/**/* }
